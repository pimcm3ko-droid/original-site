<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="utf-8">
    <title>HYUGGE CAFE</title>
    <meta name="description" content="HYUGGE CAFE">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="shortcut icon" href="img/logo.png">
    <link rel="stylesheet" href="https://unpkg.com/ress/dist/ress.min.css">
    <link rel="stylesheet"  href="css/slick.css">
    <link rel="stylesheet"  href="css/slick-theme.css">
    <link rel="stylesheet" href="scss/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@100..900&family=B612&family=Fjalla+One&display=swap" rel="stylesheet">
</head>

<body>

    <main class="contact">
        <h2 class="title">CONTACT</h2>

        <section class="contact-form">
            <form action="#">
                <dl>
                    <dt><label for="name">お名前</label></dt>
                    <dd><input type="text" id="name" class="text"></dd>
                    <dt><label for="e-mail">e-mail</label></dt>
                    <dd><input type="text" id="e-mail" class="text"></dd>
                    <dt><label for="tel">電話番号</label></dt>
                    <dd><input type="text" id="tel" class="text"></dd>
                    <dt><label for="message">お問い合わせ内容</label></dt>
                    <dd><textarea name="" id="message" class="message"></textarea></dd>
                </dl>

                <input class="form-btn" type="submit" value="送信">
            </form>
        </section>
    </main>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="js/slick.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
